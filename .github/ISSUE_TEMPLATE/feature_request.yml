name: Feature request
description: Idea for the plugin, server or dashboard
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you or your lighting operator miss during a set?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How it should work. Sketches welcome.
