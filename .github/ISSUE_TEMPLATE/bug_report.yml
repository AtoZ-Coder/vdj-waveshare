name: Bug report
description: Something broke or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [Plugin / VirtualDJ, Server, Dashboard, Not sure]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: VirtualDJ 2026 b9307, macOS 26.1, Node 22, Chrome on iPad
  - type: textarea
    id: log
    attributes:
      label: server.log
      description: The lines around the problem from server/server.log.
      render: text
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If VirtualDJ crashed, attach the newest VirtualDJ-*.ips from ~/Library/Logs/DiagnosticReports.
